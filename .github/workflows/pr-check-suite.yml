name: Check PR

on:
    # Run on pull request
    pull_request:
        branches: [main, develop]

# Sets permissions of the GITHUB_TOKEN for the depfu automerge; a pull request
# deploys nothing, so it needs no Pages permissions
permissions:
    contents: write
    pull-requests: write

# One queue per pull request: a new push cancels the older run of the same pull
# request only. A group shared with the publish would let any pull request
# cancel a release halfway, and every pull request cancel the others.
concurrency:
    group: check-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    # Sonarcloud analysis
    analysis:
        uses: ./.github/workflows/sonarcloud.yml
        secrets: inherit

    # CI
    build:
        uses: ./.github/workflows/build.yml

    # Trigger depfu merge
    trigger-automerge:
        needs: [build, analysis]
        uses: ./.github/workflows/pr-depfu-merge.yml
