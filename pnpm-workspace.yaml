allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  vue-inbrowser-compiler-demi: true
# pnpm 11 defaults `minimumReleaseAge` to 1440, holding back every version
# published less than a day ago. Turn it off: the `minimumReleaseAgeExclude`
# list it forced was a moving target, each fresh dependency had to be pinned
# into it by hand before it could be installed.
minimumReleaseAge: 0
